spring.application.name=camundator

# Server
server.port=8080

# H2 Database (file-based so data is kept after restart)
spring.datasource.url=jdbc:h2:file:./camunda-h2-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Camunda Admin User (login for Cockpit / Admin / Tasklist)
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo

# Automatically deploy BPMN and DMN resources at startup
camunda.bpm.deployment-resource-pattern=classpath*:/processes/**/*.bpmn,classpath*:/processes/**/*.dmn

# Optional but useful
camunda.bpm.filter.create=All tasks